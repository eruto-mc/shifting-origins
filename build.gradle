buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = '1.9.1'
group = 'net.erutobusiness'
base { archivesName = 'shifting_origins' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

mixin {
    add sourceSets.main, 'shiftingorigins.refmap.json'
    config 'shiftingorigins.mixins.json'
}

repositories {
    // CurseForge の任意のファイルを取れる maven（ファイルIDで指す）。
    maven { url = "https://cursemaven.com" }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Origins: Classes 1.2.1（Modrinth に Forge 1.20.1 版が無いので CurseForge から）
    compileOnly "curse.maven:origins-classes-forge-610127:4965453"
    // Apoli 1.20.1-2.9.0.8（同上）
    compileOnly "curse.maven:apoli-forge-975561:5404008"
    // Harvest with Ease 9.4.0（右クリック収穫。実物と同じファイルIDを指す）
    // ⚠ 依存を1つ増やした（2026-08-09・あなたの判断）。理由は
    //    農家の more_crop_drops が Block#playerDestroy 経由なので、
    //    Block#getDrops を直接呼ぶ右クリック収穫では**一度も発動しなかった**ため。
    compileOnly "curse.maven:harvest-with-ease-602171:5968744"
    // ⚠ **maven にしない。** これは**当部パッチ版**（origins-forge-…-eruto1）で、
    //    上流を指すと**実際に動くものと違う API でコンパイル**することになる。
    //    当部パッチ版のソースは eruto-mc/... には無く、instance/mods の実物が正。
    compileOnly files('libs/origins.jar')
    // ⚠ Calio。`Badge` が `DataObject<Badge>` を継承しているので、
    //   `AutoBadgeStrip` が `Badge` を触るだけで親の型が要る（無いと
    //   「DataObject にアクセスできません」でコンパイルが落ちる）。
    // ⚠ **上流の maven を指さない。** 実際に動くのは当部パッチ版 origins が
    //   同梱している版なので、⚠ **その jar の中（META-INF/jarjar）から取り出したもの**を置く。
    compileOnly files('libs/calio.jar')
    // ⚠ Tough As Nails（渇きの API）。⚠ **maven にしない。**
    //   `cold_storage` は Modrinth の `tough-as-nails` を指しているが、
    //   ⚠ **こちらは instance/mods に在る実物と同じ版でコンパイルしたい**
    //   （渇きの値を上流の「浄水の瓶」に合わせているので、版がずれると数字の根拠が消える）。
    //   写した元: dev/instance/mods/ToughAsNails-forge-1.20.1-9.2.0.171.jar
    compileOnly files('libs/toughasnails.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'shifting_origins',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Shifting Origins',
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'shiftingorigins.mixins.json'
        ])
    }
}
